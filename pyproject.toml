[project]
name = "veille"
version = "0.1.0"
description = "Veille économique consolidée (Tunisie, Afrique, international)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
# Prose des prompts et jeux de données de test : les longues lignes y sont voulues.
"veille/edition/prompts.py" = ["E501"]
"tests/*" = ["E501"]
