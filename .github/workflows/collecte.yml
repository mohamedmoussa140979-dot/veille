name: collecte

# Collecte des sources + alertes 🔔 (spec § 5). Les crons sont en UTC : heure de Tunis − 1 h
# (Tunis = UTC+1 toute l'année). Minutes décalées de l'heure ronde : GitHub retarde le plus
# les exécutions planifiées pile à l'heure.
on:
  schedule:
    # Lun–ven : 07:15 09:15 11:15 13:15 15:15 17:15 20:15 (Tunis)
    - cron: "15 6,8,10,12,14,16,19 * * 1-5"
    # Sam–dim : 09:15 et 18:15 (Tunis)
    - cron: "15 8,17 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour écrire l'état sur la branche data

concurrency:
  group: veille-collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Collecte
        env:
          PYTHONUNBUFFERED: "1"
          TG_TOKEN_VEILLE: ${{ secrets.TG_TOKEN_VEILLE }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m veille.collecte
