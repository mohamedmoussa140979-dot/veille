# Liste des sources (spec § 6.2). Reprise de monitor.py (44 sources) et brief.py, avec les
# corrections de la spec § 6.1 et de l'inventaire V1 (docs/bilans/V1-inventaire.md).
#
# Champs : id, nom, url, type (rss | html-generique | bct | ins | cmf | bvmt | google-news),
#   chapitre (eco-tunisie | bourse-entreprises | international | afrique | technologie),
#   langue (fr | en | ar), alerte (true = 🔔 immédiate), payant (true = 🔒, pas de lien traduit),
#   actif, et facultatif : filtre (false = exemptée du filtre éditorial).
#
# Pour ajouter une source : copier une entrée de même type, changer id, nom, url. Pour en
# désactiver une : actif: false. Les identifiants sont stables (l'état s'y réfère).

